name: Build Blackracoon APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install fixed debug keystore
        run: |
          base64 -d Blackracoon/keystore/debug.keystore.b64 > fixed.keystore
          mkdir -p $HOME/.android
          cp fixed.keystore $HOME/.android/debug.keystore
          ls -la $HOME/.android/ fixed.keystore

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.blackracoon.estimator",
            "appName": "Blackracoon Construction Estimator",
            "webDir": "www"
          }
          EOF
          mkdir -p www
          cp Blackracoon/estimator.html www/index.html
          cat Blackracoon/img-b64/banner.jpg.b64.part1 Blackracoon/img-b64/banner.jpg.b64.part2 Blackracoon/img-b64/banner.jpg.b64.part3 | base64 -d > www/banner.jpg
          cat Blackracoon/img-b64/banner_splash.png.b64.part1 Blackracoon/img-b64/banner_splash.png.b64.part2 Blackracoon/img-b64/banner_splash.png.b64.part3 | base64 -d > www/banner_splash.png
          base64 -d Blackracoon/img-b64/logo.png.b64 > www/logo.png

      - name: Add Android and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Blackracoon icon and splash
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 -d Blackracoon/img-b64/ic_launcher_$d.b64 > $RES/mipmap-$d/ic_launcher.png
            base64 -d Blackracoon/img-b64/ic_launcher_round_$d.b64 > $RES/mipmap-$d/ic_launcher_round.png
            base64 -d Blackracoon/img-b64/ic_launcher_foreground_$d.b64 > $RES/mipmap-$d/ic_launcher_foreground.png
          done
          cat Blackracoon/img-b64/banner_splash.png.b64.part1 Blackracoon/img-b64/banner_splash.png.b64.part2 Blackracoon/img-b64/banner_splash.png.b64.part3 | base64 -d > $RES/drawable/splash.png
          mkdir -p $RES/drawable-port-xxhdpi $RES/drawable-land-xxhdpi
          cat Blackracoon/img-b64/banner_splash.png.b64.part1 Blackracoon/img-b64/banner_splash.png.b64.part2 Blackracoon/img-b64/banner_splash.png.b64.part3 | base64 -d > $RES/drawable-port-xxhdpi/splash.png
          base64 -d Blackracoon/img-b64/splash_land.b64 > $RES/drawable-land-xxhdpi/splash.png

      - name: Fix Kotlin duplicate classes
        working-directory: android
        run: |
          cat >> build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Patch AndroidManifest for camera and file provider
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # Add CAMERA permission before <application tag
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' "$MANIFEST"
          fi

          # Disable Android auto-backup so localStorage is cleared on uninstall/reinstall
          sed -i 's|android:allowBackup="true"|android:allowBackup="false"|g' "$MANIFEST"

          # Add FileProvider inside <application> if not present
          if ! grep -q 'FileProvider' "$MANIFEST"; then
            sed -i 's|</application>|        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileprovider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/file_paths"/>\n        </provider>\n    </application>|' "$MANIFEST"
          fi

          # Add notification and location permissions before <application tag
          for PERM in android.permission.POST_NOTIFICATIONS android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|<application|<uses-permission android:name=\"$PERM\"/>\n    <application|" "$MANIFEST"
            fi
          done

          # Register the payment-reminder receiver inside <application>
          if ! grep -q 'NotifyReceiver' "$MANIFEST"; then
            sed -i 's|</application>|        <receiver\n            android:name=".AuthBridge$NotifyReceiver"\n            android:exported="false"/>\n    </application>|' "$MANIFEST"
          fi

          echo "=== AndroidManifest.xml after patching ==="
          cat "$MANIFEST"

      - name: Create file_paths.xml for FileProvider
        run: |
          mkdir -p android/app/src/main/res/xml
          # Find and update existing file_paths.xml, or create it
          FILE_PATHS=$(find android/app/src/main/res/xml -name "file_paths.xml" 2>/dev/null | head -1)
          if [ -z "$FILE_PATHS" ]; then
            FILE_PATHS=android/app/src/main/res/xml/file_paths.xml
          fi
          cat > "$FILE_PATHS" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="my_images" path="." />
              <external-cache-path name="my_cache_images" path="." />
              <cache-path name="camera_photos" path="photos/" />
              <cache-path name="my_internal_cache" path="." />
              <files-path name="my_files" path="." />
              <external-files-path name="my_external_files" path="." />
          </paths>
          EOF
          echo "=== file_paths.xml ==="
          cat "$FILE_PATHS"

      - name: Patch MainActivity with camera and file bridge
        run: |
          MAIN=$(find android -name "MainActivity.java" -o -name "MainActivity.kt" 2>/dev/null | head -1)
          echo "Found: $MAIN"
          cat > android/app/src/main/java/com/blackracoon/estimator/MainActivity.java << 'JAVAEOF'
          package com.blackracoon.estimator;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.net.Uri;
          import android.content.Intent;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.util.Base64;
          import android.widget.Toast;
          import android.provider.MediaStore;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import android.os.CancellationSignal;
          import android.os.ParcelFileDescriptor;
          import android.print.PageRange;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintDocumentInfo;
          import android.print.PrintManager;
          import android.webkit.WebViewClient;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST = 1;
              private static final int STORAGE_PERMISSION_REQUEST = 2;
              private static final int CAMERA_REQUEST = 3;
              private static final int BACKUP_PICK_REQUEST = 7;
              private static final int CAMERA_PERMISSION_REQUEST = 8;
              private File cameraOutputFile;
              private WebView mainWebView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                              != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this,
                              new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE},
                              STORAGE_PERMISSION_REQUEST);
                      }
                  }

                  mainWebView = getBridge().getWebView();
                  WebSettings settings = mainWebView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDomStorageEnabled(true);

                  mainWebView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");

                  mainWebView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == CAMERA_PERMISSION_REQUEST && mainWebView != null) {
                      mainWebView.post(new Runnable() {
                          public void run() {
                              mainWebView.evaluateJavascript(
                                  "window.__onCameraPermissionResult && window.__onCameraPermissionResult()", null);
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback != null) {
                          Uri[] results = null;
                          if (resultCode == Activity.RESULT_OK && data != null) {
                              results = new Uri[]{data.getData()};
                          }
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  } else if (requestCode == CAMERA_REQUEST) {
                    if (cameraOutputFile == null) {
                        String savedPath = getSharedPreferences("br_camera", MODE_PRIVATE).getString("last_path", null);
                        if (savedPath != null) cameraOutputFile = new File(savedPath);
                    }
                    getSharedPreferences("br_camera", MODE_PRIVATE).edit().remove("last_path").apply();
                      if (resultCode == Activity.RESULT_OK
                              && cameraOutputFile != null
                              && cameraOutputFile.exists()
                              && cameraOutputFile.length() > 0) {
                          try {
                              byte[] bytes = readFile(cameraOutputFile);
                              String b64 = Base64.encodeToString(bytes, Base64.NO_WRAP);
                              final String dataUrl = "data:image/jpeg;base64," + b64;
                              mainWebView.post(new Runnable() {
                                  public void run() {
                                      mainWebView.evaluateJavascript(
                                          "receiveNativePhoto('" + dataUrl + "')", null);
                                  }
                              });
                          } catch (Exception e) {
                              e.printStackTrace();
                          } finally {
                              cameraOutputFile.delete();
                              cameraOutputFile = null;
                          }
                                          } else if (cameraOutputFile != null) {
                        cameraOutputFile.delete();
                        cameraOutputFile = null;
                    }
                } else if (requestCode == BACKUP_PICK_REQUEST) {
                    if (resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {
                        try {
                            InputStream is = getContentResolver().openInputStream(data.getData());
                            ByteArrayOutputStream bos = new ByteArrayOutputStream();
                            byte[] buf = new byte[8192];
                            int len;
                            while ((len = is.read(buf)) != -1) bos.write(buf, 0, len);
                            is.close();
                            final String b64 = Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP);
                            mainWebView.post(new Runnable() {
                                public void run() {
                                    mainWebView.evaluateJavascript(
                                        "importBackupBase64('" + b64 + "')", null);
                                }
                            });
                        } catch (Exception e) {
                            e.printStackTrace();
                        }
                    }
                }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              private byte[] readFile(File file) throws IOException {
                  FileInputStream fis = new FileInputStream(file);
                  ByteArrayOutputStream bos = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int len;
                  while ((len = fis.read(buf)) != -1) bos.write(buf, 0, len);
                  fis.close();
                  return bos.toByteArray();
              }

              class AndroidBridge {

                @JavascriptInterface
                public void takePhoto() {
                    runOnUiThread(new Runnable() {
                    public void run() {                        
                                    if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)
                                    != PackageManager.PERMISSION_GRANTED) {
                                ActivityCompat.requestPermissions(MainActivity.this,
                                    new String[]{Manifest.permission.CAMERA}, CAMERA_PERMISSION_REQUEST);
                                return;
                            }
                            launchCamera();
                        }
                    });
                }

                private void launchCamera() {
                    try {
                        File dir = new File(getCacheDir(), "photos");
                        dir.mkdirs();
                        cameraOutputFile = File.createTempFile("photo_", ".jpg", dir);
                        getSharedPreferences("br_camera", MODE_PRIVATE).edit()
                            .putString("last_path", cameraOutputFile.getAbsolutePath()).apply();
                        Uri photoUri = FileProvider.getUriForFile(
                            MainActivity.this,
                            getPackageName() + ".fileprovider",
                            cameraOutputFile
                        );
                        Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                        intent.putExtra(MediaStore.EXTRA_OUTPUT, photoUri);
                        intent.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                        intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                        intent.setClipData(android.content.ClipData.newRawUri("", photoUri));
                        startActivityForResult(intent, CAMERA_REQUEST);
                    } catch (Exception e) {
                        e.printStackTrace();
                        cameraFallbackToPicker();
                    }
                }
                @JavascriptInterface
                public void launchCameraNow() {
                    runOnUiThread(new Runnable() {
                        public void run() {
                            launchCamera();
                        }
                    });
                }

                private void cameraFallbackToPicker() {
                    if (mainWebView != null) {
                        mainWebView.post(new Runnable() {
                            public void run() {
                                mainWebView.evaluateJavascript(
                                    "window.__cameraFallback && window.__cameraFallback()", null);
                            }
                        });
                    }
                }

                @JavascriptInterface
                public void saveBase64File(String base64Data, String fileName, String mimeType) {
                    try {
                        String[] parts = base64Data.split(",");
                        byte[] bytes = Base64.decode(
                            parts.length > 1 ? parts[1] : parts[0], Base64.DEFAULT);
                        toastSaved(writeToDownloads(bytes, fileName, mimeType), fileName);
                    } catch (Exception e) {
                        e.printStackTrace();
                        toastSaved(false, fileName);
                    }
                }

                @JavascriptInterface
                public void saveTextFile(String content, String fileName, String mimeType) {
                    try {
                        byte[] bytes = content.getBytes("UTF-8");
                        toastSaved(writeToDownloads(bytes, fileName, mimeType), fileName);
                    } catch (Exception e) {
                        e.printStackTrace();
                        toastSaved(false, fileName);
                    }
                }

                @JavascriptInterface
                public void pickBackupFile() {
                    runOnUiThread(new Runnable() {
                        public void run() {
                            try {
                                Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                                intent.addCategory(Intent.CATEGORY_OPENABLE);
                                intent.setType("*/*");
                                intent.putExtra(Intent.EXTRA_MIME_TYPES,
                                    new String[]{"application/json", "text/plain"});
                                startActivityForResult(intent, BACKUP_PICK_REQUEST);
                            } catch (Exception e) {
                                e.printStackTrace();
                            }
                        }
                    });
                }

                private boolean writeToDownloads(byte[] bytes, String fileName, String mimeType) {
                    try {
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                            ContentValues cv = new ContentValues();
                            cv.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                            cv.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                            cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                            Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                            if (uri == null) return false;
                            OutputStream os = getContentResolver().openOutputStream(uri);
                            if (os == null) return false;
                            os.write(bytes);
                            os.close();
                            return true;
                        }
                        File downloadsDir = Environment.getExternalStoragePublicDirectory(
                            Environment.DIRECTORY_DOWNLOADS);
                        File file = new File(downloadsDir, fileName);
                        FileOutputStream fos = new FileOutputStream(file);
                        fos.write(bytes);
                        fos.close();
                        return true;
                    } catch (Exception e) {
                        e.printStackTrace();
                        return false;
                    }
                }

                private void toastSaved(final boolean ok, final String fileName) {
                    runOnUiThread(new Runnable() {
                        public void run() {
                            Toast.makeText(MainActivity.this,
                                ok ? "Guardado en Descargas: " + fileName : "Error al guardar archivo",
                                ok ? Toast.LENGTH_LONG : Toast.LENGTH_SHORT).show();
                        }
                    });
                }

                  @JavascriptInterface
                  public void printHtml(final String html, final String name) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              final WebView pv = new WebView(MainActivity.this);
                              pv.getSettings().setJavaScriptEnabled(true);
                              pv.loadDataWithBaseURL("file:///android_asset/", html, "text/html", "UTF-8", null);
                              pv.setWebViewClient(new WebViewClient() {
                                  public void onPageFinished(WebView view, String url) {
                                      PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                                      PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(name);
                                      PrintAttributes attrs = new PrintAttributes.Builder()
                                          .setMediaSize(PrintAttributes.MediaSize.NA_LETTER)
                                          .build();
                                      pm.print(name, adapter, attrs);
                                  }
                              });
                          }
                      });
                  }

                  @JavascriptInterface
                  public void saveHtmlAsPdf(final String html, final String name) {
                      printHtml(html, name);
                  }

                  @JavascriptInterface
                  public void shareHtmlAsImage(final String html, final String name, final String channel) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              WebView.enableSlowWholeDocumentDraw();
                            final WebView iv = new WebView(MainActivity.this);
                              iv.getSettings().setJavaScriptEnabled(true);
                              iv.loadDataWithBaseURL("file:///android_asset/", html, "text/html", "UTF-8", null);
                              iv.setWebViewClient(new WebViewClient() {
                                  public void onPageFinished(final WebView view, String url) {
                                    new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() {
                                        public void run() {
                                      int width = 1080;
                                      int height = Math.max(view.getContentHeight(), 400);
                                      if (height > 8000) height = 8000;
                                      view.measure(android.view.View.MeasureSpec.makeMeasureSpec(width, android.view.View.MeasureSpec.EXACTLY),
                                        android.view.View.MeasureSpec.makeMeasureSpec(height, android.view.View.MeasureSpec.EXACTLY));
                                    view.layout(0, 0, width, height);
                                      try {
                                          android.graphics.Bitmap bmp = android.graphics.Bitmap.createBitmap(
                                              width, height, android.graphics.Bitmap.Config.ARGB_8888);
                                          android.graphics.Canvas c = new android.graphics.Canvas(bmp);
                                          c.drawColor(android.graphics.Color.WHITE);
                                          view.draw(c);
                                          String safeName = name.replaceAll("[^a-zA-Z0-9_\\-]", "_");
                                          File imgFile = new File(getCacheDir(), safeName + ".png");
                                          FileOutputStream fos = new FileOutputStream(imgFile);
                                          bmp.compress(android.graphics.Bitmap.CompressFormat.PNG, 90, fos);
                                          fos.close();
                                          bmp.recycle();
                                          Uri uri = FileProvider.getUriForFile(
                                              MainActivity.this, getPackageName() + ".fileprovider", imgFile);
                                          Intent intent = new Intent(Intent.ACTION_SEND);
                                          intent.setType("image/png");
                                          intent.putExtra(Intent.EXTRA_STREAM, uri);
                                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                          if ("whatsapp".equals(channel)) {
                                              intent.setPackage("com.whatsapp");
                                          }
                                          if ("whatsapp".equals(channel)) {
                                            try {
                                              startActivity(intent);
                                          } catch (Exception e) {
                                              startActivity(Intent.createChooser(intent, "Compartir"));
                                          }
                                        } else {
                                            startActivity(Intent.createChooser(intent, "Compartir"));
                                        }
                                      } catch (Exception e) {
                                          e.printStackTrace();
                                          Toast.makeText(MainActivity.this,
                                              "Error al generar imagen", Toast.LENGTH_SHORT).show();
                                      }
                                    }
                                    }, 500);
                                  }
                              });
                          }
                      });
                  }

                  @JavascriptInterface
                  public void shareHtmlAsPdf(final String html, final String name, final String channel) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              WebView.enableSlowWholeDocumentDraw();
                            final WebView pv = new WebView(MainActivity.this);
                              pv.getSettings().setJavaScriptEnabled(true);
                              pv.loadDataWithBaseURL("file:///android_asset/", html, "text/html", "UTF-8", null);
                              pv.setWebViewClient(new WebViewClient() {
                                  public void onPageFinished(final WebView view, String url) {
                                    new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() {
                                        public void run() {
                                      try {
                                          String safeName = name.replaceAll("[^a-zA-Z0-9_\\-]", "_");
                                          final File pdfFile = new File(getCacheDir(), safeName + ".pdf");
                                          int pdfW = 816;
                                          view.measure(android.view.View.MeasureSpec.makeMeasureSpec(pdfW, android.view.View.MeasureSpec.EXACTLY),
                                              android.view.View.MeasureSpec.makeMeasureSpec(0, android.view.View.MeasureSpec.UNSPECIFIED));
                                      view.layout(0, 0, view.getMeasuredWidth(), view.getMeasuredHeight());
                                      view.setBackgroundColor(android.graphics.Color.WHITE);
                                      android.graphics.pdf.PdfDocument doc = new android.graphics.pdf.PdfDocument();
                                      int pageW = 612;
                                      int pageH = 792;
                                      float scale = (float) pageW / pdfW;
                                      int pageViewH = (int) (pageH / scale);
                                      int totalH = Math.max(view.getMeasuredHeight(), pageViewH);
                                      int pages = Math.max(1, (int) Math.ceil((double) totalH / pageViewH));
                                      for (int i = 0; i < pages; i++) {
                                          android.graphics.pdf.PdfDocument.PageInfo pinfo = new android.graphics.pdf.PdfDocument.PageInfo.Builder(pageW, pageH, i).create();
                                          android.graphics.pdf.PdfDocument.Page page = doc.startPage(pinfo);
                                          android.graphics.Canvas canvas = page.getCanvas();
                                          canvas.drawColor(android.graphics.Color.WHITE);
                                          canvas.save();
                                          canvas.scale(scale, scale);
                                          canvas.translate(0, -i * pageViewH);
                                          canvas.clipRect(0, i * pageViewH, pdfW, Math.min((i + 1) * pageViewH, totalH));
                                          view.draw(canvas);
                                          canvas.restore();
                                          doc.finishPage(page);
                                  }
                                  java.io.FileOutputStream fos = new java.io.FileOutputStream(pdfFile);
                                  doc.writeTo(fos);
                                  fos.close();
                                  doc.close();
                                  Uri uri = FileProvider.getUriForFile(
                                      MainActivity.this,
                                      getPackageName() + ".fileprovider",
                                      pdfFile);
                              Intent intent = new Intent(Intent.ACTION_SEND);
                              intent.setType("application/pdf");
                              intent.putExtra(Intent.EXTRA_STREAM, uri);
                              intent.putExtra(Intent.EXTRA_SUBJECT, name);
                              intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              if ("whatsapp".equals(channel)) {
                                  intent.setPackage("com.whatsapp");
                          }
                          if ("whatsapp".equals(channel)) {
                                            try {
                              startActivity(intent);
                      } catch (Exception ex) {
                          startActivity(Intent.createChooser(intent, "Compartir"));
                  }
                                        } else {
                                            startActivity(Intent.createChooser(intent, "Compartir"));
                                        }
                                      } catch (Exception e) {
                                          e.printStackTrace();
                                          Toast.makeText(MainActivity.this,
                                              "Error al generar PDF", Toast.LENGTH_SHORT).show();
                                                                              }
                                    }
                                    }, 500);
                                  }
                              });
                          }
                      });
                  }
              }
          }
          JAVAEOF

      - name: Add Firebase authentication
        run: |
          cp Blackracoon/android/app/google-services.json android/app/google-services.json
          cp fixed.keystore android/app/fixed.keystore
          sed -i "/com.android.tools.build:gradle/a\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          grep -n "google-services" android/build.gradle
          cat >> android/app/build.gradle << 'GRADLEEOF'
          apply plugin: 'com.google.gms.google-services'
          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.3.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.android.gms:play-services-auth:21.2.0'
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          android {
              signingConfigs {
                  fixedDebug {
                      storeFile file('fixed.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixedDebug
                  }
              }
          }
          GRADLEEOF
          cp Blackracoon/AuthBridge.java android/app/src/main/java/com/blackracoon/estimator/AuthBridge.java
          python3 << 'PYEOF'
          p = 'android/app/src/main/java/com/blackracoon/estimator/MainActivity.java'
          s = open(p).read()
          a = 'mainWebView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");'
          assert a in s, 'anchor registro bridge no encontrado'
          s = s.replace(a, a + '\n                  authBridge = new AuthBridge(MainActivity.this, mainWebView);\n                  mainWebView.addJavascriptInterface(authBridge, "AuthBridge");', 1)
          b = 'private WebView mainWebView;'
          assert b in s, 'anchor campo webview no encontrado'
          s = s.replace(b, b + '\n              private AuthBridge authBridge;', 1)
          c = '        super.onActivityResult(requestCode, resultCode, data);'
          assert s.count(c) == 1, 'anchor onActivityResult no unico'
          s = s.replace(c, '        if (authBridge != null) authBridge.onActivityResult(requestCode, resultCode, data);\n' + c, 1)
          open(p, 'w').write(s)
          print('MainActivity parcheado para AuthBridge')
          PYEOF

      - name: Build Blackracoon APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blackracoon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
